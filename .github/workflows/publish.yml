name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  authorize:
    name: Check the tag against the version and its notes
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require an annotated tag matching build.zig.zon and committed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test -f "release-notes/$RELEASE_TAG.md"
          test ! -L "release-notes/$RELEASE_TAG.md"
          test -s "release-notes/$RELEASE_TAG.md"

  build:
    name: Build the release archives from the tag
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build both targets
        run: |
          release/stage.sh linux release-assets
          release/stage.sh windows release-assets
      - name: Keep the archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Checksum, attest, and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Download the archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: release-assets
      - name: Write SHA256SUMS
        run: cd release-assets && sha256sum -- * > SHA256SUMS
      - name: Install the release-verification GitHub CLI
        env:
          GH_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_VERSION: 2.96.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory="$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Attest every asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: release-assets/*
      - name: Verify the attestations before publishing
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in release-assets/*; do
            gh attestation verify "$asset" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Publish the Release, or verify the one already published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="release-notes/${RELEASE_TAG}.md"
          if release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>release-error.txt); then
            # Releases are immutable: a rerun checks what is there instead of replacing it.
            jq -e --arg tag "$RELEASE_TAG" --rawfile notes "$notes_file" '.tag_name == $tag and .name == $tag and .draft == false and .prerelease == false and .immutable == true and .body == $notes' <<<"$release" >/dev/null
            (cd release-assets && ls -1) | LC_ALL=C sort > expected-assets.txt
            jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort > published-assets.txt
            cmp expected-assets.txt published-assets.txt
            gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
            mkdir existing-release
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-release
            (cd existing-release && sha256sum --check --strict SHA256SUMS)
          elif grep -F '(HTTP 404)' release-error.txt >/dev/null; then
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes_file" --title "$RELEASE_TAG"
          else
            cat release-error.txt >&2
            exit 1
          fi
