name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validation.yml

  build:
    name: Build the release archives from the tag
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - name: Require an annotated tag matching build.zig.zon and committed release notes
        uses: wakamex/release-actions/verify-release-tag@v1
        with:
          version-command: >-
            sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Build both targets
        run: |
          release/stage.sh linux release-assets
          release/stage.sh windows release-assets
      - name: Keep the archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: wakamex/release-actions/.github/workflows/binary-release.yml@v1
    with:
      artifact: release-assets
